<svg viewBox="0 0 600 320" width="600" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Circuit diagram. GPIO 4 feeds a chain of three 330 ohm and two 10 kilohm resistors. Their end is the measuring node, which connects to GPIO 17 and to the soil probes. The probes return to ground. GPIO 27 drives an LED through a 330 ohm resistor.">
<style>
  svg { --paper:#F1F4EE; --surface:#FFFFFF; --ink:#17211B; --muted:#576A5E; --line:#D3DCD0;
        --wet:#1D6BA3; --dry:#B05E14; --led:#E39B0B; --nodec:var(--dry); --soilc:var(--dry); }
  @media (prefers-color-scheme: dark) {
    svg { --paper:#0E1511; --surface:#16201A; --ink:#E3ECE4; --muted:#92A598; --line:#28382E;
          --wet:#5DB1EE; --dry:#E39650; --led:#FFC247; }
  }
  .bg { fill: var(--paper); stroke: var(--line); stroke-width: 1; }
  .box, .part { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
  .wire { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
  .wire.node { stroke: var(--nodec); }
  .soil { fill: var(--soilc); fill-opacity: .3; stroke: var(--soilc); stroke-width: 2; }
  .dot { fill: var(--ink); }
  .node-fill { fill: var(--nodec); }
  .t { font: 500 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .t.m { fill: var(--muted); }
  .t.b { font-weight: 700; }
  .glow { fill: var(--led); opacity: .35; }
  .ledfill { fill: var(--led); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
</style>
<rect class="bg" x="0.5" y="0.5" width="599" height="319" rx="12"/>
  <!-- Raspberry Pi -->
  <rect x="16" y="16" width="140" height="288" rx="8" class="box"/>
  <text x="86" y="42" text-anchor="middle" class="t b">Raspberry Pi</text>
  <text x="146" y="80" text-anchor="end" class="t">GPIO 4 · Pin 7</text>
  <text x="146" y="164" text-anchor="end" class="t">GPIO 17 · Pin 11</text>
  <text x="146" y="240" text-anchor="end" class="t">GPIO 27 · Pin 13</text>
  <text x="146" y="284" text-anchor="end" class="t">GND · Pin 6</text>

  <!-- supply pulse through the resistor chain -->
  <line x1="156" y1="76" x2="200" y2="76" class="wire"/>
  <rect x="200" y="62" width="190" height="28" rx="4" class="part"/>
  <text x="295" y="80" text-anchor="middle" class="t">3 × 330 Ω + 2 × 10 kΩ</text>
  <line x1="390" y1="76" x2="470" y2="76" class="wire node"/>
  <line x1="470" y1="76" x2="470" y2="196" class="wire node"/>
  <text x="295" y="52" text-anchor="middle" class="t m">supply pulse, 10 ms</text>

  <!-- measuring node to GPIO 17 -->
  <line x1="156" y1="160" x2="470" y2="160" class="wire node"/>
  <circle cx="470" cy="160" r="4.5" class="dot node-fill"/>
  <text x="300" y="150" text-anchor="middle" class="t m">measuring node</text>
  <text x="482" y="150" class="t b" id="nodeV">2.07 V</text>

  <!-- soil probes -->
  <rect x="458" y="196" width="24" height="60" rx="4" class="soil"/>
  <text x="494" y="222" class="t">Soil</text>
  <text x="494" y="238" class="t m">probes</text>
  <line x1="470" y1="256" x2="470" y2="280" class="wire"/>

  <!-- ground rail -->
  <line x1="156" y1="280" x2="470" y2="280" class="wire"/>
  <circle cx="350" cy="280" r="4.5" class="dot"/>
  <text x="250" y="300" text-anchor="middle" class="t m">common ground</text>

  <!-- LED branch -->
  <line x1="156" y1="236" x2="190" y2="236" class="wire"/>
  <rect x="190" y="224" width="60" height="24" rx="4" class="part"/>
  <text x="220" y="216" text-anchor="middle" class="t m">330 Ω</text>
  <line x1="250" y1="236" x2="296" y2="236" class="wire"/>
  <circle cx="310" cy="236" r="30" class="glow"/>
  <path d="M296 222 L296 250 L324 236 Z" class="ledfill"/>
  <line x1="326" y1="222" x2="326" y2="250" class="wire"/>
  <line x1="326" y1="236" x2="350" y2="236" class="wire"/>
  <line x1="350" y1="236" x2="350" y2="280" class="wire"/>
  <text x="310" y="204" text-anchor="middle" class="t m">LED</text>
</svg>
